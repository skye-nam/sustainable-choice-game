<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Making the Sustainable Choice the Easy One · CIV300 G13</title>
<style>
:root{
  --bg:#040a17; --panel:#0d1a2d; --panel2:#14263f; --line:#27425f;
  --ink:#eef8f6; --muted:#a9c0c6; --teal:#2dd4bf; --green:#4ade80; --red:#fb7185;
  --accent:#2dd4bf;
  --fs:clamp(17px,0.6vw + 13px,23px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;transform:scale(.985);
  transition:opacity .45s ease,transform .45s ease,visibility 0s .45s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.stars{background:
  radial-gradient(1.5px 1.5px at 12% 22%,#fff9,transparent 60%),radial-gradient(1px 1px at 28% 71%,#fff8,transparent 60%),
  radial-gradient(1.5px 1.5px at 44% 12%,#fff7,transparent 60%),radial-gradient(1px 1px at 61% 83%,#fff9,transparent 60%),
  radial-gradient(2px 2px at 77% 31%,#fff6,transparent 60%),radial-gradient(1px 1px at 89% 64%,#fff8,transparent 60%),
  radial-gradient(1px 1px at 7% 88%,#fff7,transparent 60%),radial-gradient(1.5px 1.5px at 52% 49%,#fff5,transparent 60%),
  radial-gradient(1px 1px at 35% 38%,#fff6,transparent 60%),radial-gradient(1px 1px at 94% 9%,#fff8,transparent 60%),
  radial-gradient(ellipse at 50% 120%,#0c3b4a 0%,transparent 60%),var(--bg)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(#040a17f2,#040a17b0);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid #ffffff14;transition:opacity .4s,transform .4s}
#hud.off{opacity:0;transform:translateY(-100%);pointer-events:none}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;position:relative}
.stat small{color:var(--muted);font-size:.72em;text-transform:uppercase;letter-spacing:.08em}
.stat b{font-size:1.15em;font-variant-numeric:tabular-nums}
#score{color:var(--teal)}
.spacer{flex:1}
.hbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85em;min-height:42px}
.hbtn:hover{border-color:var(--teal)}
.hbtn[aria-pressed="true"]{background:#2dd4bf22;border-color:var(--teal)}
#finish{background:var(--teal);color:#04201c;font-weight:700;border-color:transparent}
#finish:disabled{background:var(--panel);color:#6f8790;border-color:var(--line);cursor:not-allowed}
#finish:not(:disabled){animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #2dd4bf88}50%{box-shadow:0 0 0 10px #2dd4bf00}}
.float{position:fixed;z-index:30;font-weight:800;font-size:1.5em;color:var(--green);pointer-events:none;
  text-shadow:0 2px 12px #000;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,46px) scale(.7)}20%{opacity:1;transform:translate(-50%,26px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-14px) scale(1)}}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- title ---------- */
#s-title,#s-final{display:flex}
.center{margin:auto;padding:28px 20px;max-width:900px;text-align:center}
.orb{width:clamp(110px,22vmin,190px);aspect-ratio:1;border-radius:50%;margin:0 auto 26px;position:relative;
  background:radial-gradient(circle at 32% 30%,#5eead4,#0e7490 45%,#0b2447 80%);
  box-shadow:0 0 60px #2dd4bf66,inset -18px -18px 40px #0009;animation:bob 5s ease-in-out infinite}
.orb::before,.orb::after{content:"";position:absolute;border-radius:50%;background:#34d39999}
.orb::before{width:38%;height:30%;left:16%;top:22%;border-radius:60% 40% 55% 45%}
.orb::after{width:30%;height:36%;left:54%;top:46%;border-radius:45% 55% 40% 60%}
@keyframes bob{50%{transform:translateY(-10px)}}
h1{font-size:clamp(1.7em,5.2vw,3.1em);line-height:1.12;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--teal)}
.pitch{color:var(--muted);font-size:1.12em;margin:18px auto 30px;max-width:34em}
.btn{background:var(--accent);color:#04201c;border:0;border-radius:14px;padding:14px 30px;font-weight:750;font-size:1.05em;min-height:54px;
  box-shadow:0 6px 24px #0006;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fine{color:#7f99a1;font-size:.72em;margin-top:26px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:inherit;font-size:.9em;background:var(--panel)}

/* ---------- globe ---------- */
#s-globe{overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.grab{cursor:grabbing}#globe.point{cursor:pointer}
#tip{position:absolute;z-index:5;pointer-events:none;background:#0d1a2df2;border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  transform:translate(-50%,calc(-100% - 26px));opacity:0;transition:opacity .15s;white-space:nowrap;font-size:.85em;box-shadow:0 8px 24px #000a}
#tip.on{opacity:1}#tip b{display:block;font-size:1.1em}#tip span{color:var(--muted)}
#dock{position:absolute;left:0;right:0;bottom:0;padding:10px 12px max(14px,env(safe-area-inset-bottom));text-align:center;
  background:linear-gradient(transparent,#040a17e6 40%)}
#hint{color:var(--muted);font-size:.82em;margin-bottom:8px}
#chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--panel);border:2px solid var(--c,var(--line));border-radius:999px;padding:8px 16px;min-height:46px;font-size:.88em;display:flex;align-items:center;gap:8px}
.chip:hover{background:var(--panel2)}
.chip small{color:var(--muted)}
.chip .ck{color:var(--green);font-weight:800}

/* ---------- stage (cards) ---------- */
.wrap{max-width:920px;margin:0 auto;padding:86px 14px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0009}
.card.in{animation:cardIn .45s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}}
.banner{position:relative;height:clamp(120px,20vh,180px);overflow:hidden;
  background:linear-gradient(135deg,var(--accent),#0d1a2d 130%);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#0d1a2d),color-mix(in srgb,var(--accent) 18%,#0d1a2d))}
.banner.sm{height:clamp(76px,11vh,104px)}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .emo{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:.5em;font-size:clamp(2em,7vh,3.4em);filter:drop-shadow(0 4px 8px #0008)}
.banner.sm .emo{font-size:clamp(1.5em,4.5vh,2.2em);justify-content:flex-end;padding-right:18px;bottom:14%}
.banner .emo span:nth-child(2){animation:bob 4s ease-in-out infinite}
.place{position:absolute;left:16px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:#04101fcc;border:1px solid #ffffff40;border-radius:999px;padding:3px 12px;font-size:.74em;font-weight:650;letter-spacing:.03em}
.tag.topic{background:var(--accent);color:#04201c;border-color:transparent;text-transform:uppercase;letter-spacing:.08em}
.body{padding:clamp(18px,3.2vw,36px)}
.kicker{color:var(--accent);font-weight:750;font-size:.8em;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:inline-flex;gap:5px}.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--accent)}
h2{font-size:clamp(1.3em,3.2vw,1.85em);line-height:1.2;margin-bottom:14px}
h3{font-size:1.1em;margin:20px 0 10px}
.body p{margin-bottom:14px}
.lead{font-size:1.1em}
.situation{background:var(--panel2);border-left:5px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 16px;margin-bottom:16px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--panel2);min-height:58px;transition:border-color .15s,transform .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(4px)}
.opt .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#04201c;font-weight:800}
.opt:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.opt:disabled .n{background:var(--line);color:var(--muted)}
.ribbon{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;margin-bottom:16px;font-weight:750;font-size:1.08em}
.ribbon.good{background:#4ade8022;border:2px solid var(--green)}
.ribbon.learn{background:#fbbf2420;border:2px solid #fbbf24}
.ribbon .pts{margin-left:auto;color:var(--green);font-size:1.2em;white-space:nowrap}
.pick{color:var(--muted);margin-bottom:12px}.pick b{color:var(--ink)}
.box{background:var(--panel2);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.box h4{margin:0 0 4px;font-size:.78em;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}
.actions .key{color:var(--muted);font-size:.78em}
.note{color:var(--muted);font-size:.78em;margin-top:10px}
.src{display:none;margin-top:12px;border:1px dashed #fbbf2499;border-radius:12px;padding:10px 14px;font-size:.78em;color:#fde68a}
body.notes .src{display:block}
.retry{color:#fbbf24;font-weight:650;font-size:.85em}
.outcome{margin:0 0 14px;border-radius:14px;overflow:hidden;border:2px solid #fbbf24;background:var(--panel2)}
.outcome.good{border-color:var(--green)}
.outcome svg{display:block;width:100%;height:auto;max-height:30vh}
.outcome figcaption{padding:5px 14px;font-size:.7em;text-transform:uppercase;letter-spacing:.1em;font-weight:750;color:var(--muted)}
.chipt{display:inline-block;font-size:.66em;border-radius:999px;padding:0 10px;font-weight:700;border:1.5px solid;white-space:nowrap;vertical-align:middle;text-transform:none;letter-spacing:0}
.chipt.doc{color:var(--green)}.chipt.asm{color:#fbbf24}
.concept{border-radius:16px;padding:16px 18px;margin:16px 0;background:var(--panel2);border-left:6px solid var(--teal)}
.concept small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.72em;color:var(--teal);font-weight:750}
.concept h3{margin:2px 0 8px}.concept p{margin-bottom:8px}.concept p:last-child{margin-bottom:0}
details.sources{margin-top:14px;font-size:.8em;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
details.sources summary{cursor:pointer;font-weight:650;color:var(--ink)}
details.sources ul{margin:8px 0 4px;padding-left:1.2em}details.sources li{margin-bottom:4px}

/* ---------- replay visuals ---------- */
.change{border:2px dashed var(--accent);border-radius:14px;padding:12px 16px;margin:14px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;scroll-margin-top:130px}
.side{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden;min-width:0}
.side.after{border-color:var(--accent)}
.side h4{margin:0 0 10px;font-size:.86em}
.side h4 span{display:inline-block;font-size:.8em;text-transform:uppercase;letter-spacing:.1em;padding:1px 10px;border-radius:999px;background:var(--line);margin-right:6px}
.side.after h4 span{background:var(--accent);color:#04201c}
.side .inner{transition:filter .6s,opacity .6s}
.side.locked .inner{filter:blur(9px);opacity:.25}
.side .lock{position:absolute;inset:0;display:none;place-items:center;text-align:center;font-weight:750;padding:20px}
.side.locked .lock{display:grid}
.grp{margin-top:12px}.grp:first-child{margin-top:0}
.grp>b{display:block;font-size:.78em;color:var(--muted);margin-bottom:6px}
.row{margin-bottom:8px}
.row .lab{display:flex;justify-content:space-between;gap:8px;font-size:.8em;flex-wrap:wrap}
.row .lab em{font-style:normal;font-weight:750}
.bar{height:16px;border-radius:8px;background:#0007;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--muted);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.side.after .bar i{background:var(--accent)}
.vt{display:inline-block;font-size:.72em;border-radius:999px;padding:0 9px;margin-top:4px;font-weight:650}
.vt.ok{background:#4ade8026;color:var(--green)}.vt.no{background:#fb718526;color:var(--red)}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:120px;text-align:center}
.bin>b{display:block;font-size:.66em;color:var(--muted);line-height:1.2;margin-bottom:6px;min-height:2.4em}
.item{display:inline-flex;flex-direction:column;align-items:center;width:3.3em;margin:2px;padding:3px 2px;border-radius:10px;background:#0005;border:2px solid transparent;position:relative;
  font-size:.82em;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.item span{font-size:1.5em;line-height:1.2}.item small{font-size:.6em;line-height:1.15;color:var(--muted)}
.item.bad{border-color:var(--red);background:#fb718522}
.item.bad::after{content:"✕";position:absolute;top:-8px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
@keyframes pop{from{opacity:0;transform:translateY(-22px) scale(.4)}}
.tally{font-size:.8em;font-weight:700;margin-top:10px}.tally.ok{color:var(--green)}.tally.no{color:var(--red)}
.chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;margin:16px 0}
.chain div{background:var(--panel2);border-radius:14px;padding:12px;border-top:4px solid var(--accent);animation:cardIn .5s both}
.chain div:nth-child(3){animation-delay:.25s}.chain div:nth-child(5){animation-delay:.5s}
.chain small{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.66em;color:var(--accent);font-weight:750;margin-bottom:4px}
.chain .arr{background:none;border:0;padding:0;display:grid;place-items:center;font-size:1.5em;color:var(--accent);animation:none}
.idea{border:2px solid var(--accent);border-radius:16px;padding:16px 18px;margin:16px 0;background:var(--panel2)}
.idea small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.72em;color:var(--accent);font-weight:750;margin-bottom:4px}
.big{font-size:clamp(2.2em,7vw,3.6em);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.big small{font-size:.4em;color:var(--muted);font-weight:600}

/* ---------- final ---------- */
.rank{display:inline-block;margin:10px 0 6px;padding:8px 22px;border-radius:999px;background:linear-gradient(90deg,#2dd4bf,#4ade80);color:#04201c;font-weight:800;font-size:1.25em}
.takes{list-style:none;padding:0;margin:22px auto;display:grid;gap:10px;text-align:left;max-width:760px}
.takes li{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.takes li span{font-size:1.5em}
.home{font-size:1.15em;font-weight:650;max-width:30em;margin:0 auto 24px}
.credits{color:var(--muted);font-size:.8em;margin-top:26px}

@media (max-width:620px){
  .cmp{grid-template-columns:1fr}
  .chain{grid-template-columns:1fr}.chain .arr{transform:rotate(90deg)}
  .stat{padding:5px 12px}.hbtn{padding:6px 11px}
  .hbtn .lbl{display:none}
  .wrap{padding-top:112px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<header id="hud" class="off">
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Countries</small><b id="prog">0/4</b></div>
  <div class="spacer"></div>
  <button class="hbtn" id="b-globe" title="Back to the globe">🌍 <span class="lbl">Globe</span></button>
  <button class="hbtn" id="b-notes" aria-pressed="false" title="Show the team's fact-check notes (N)">📝 <span class="lbl">Notes</span></button>
  <button class="hbtn" id="b-full" title="Fullscreen (F)">⛶</button>
  <button class="hbtn" id="finish" disabled>Finish 🏁</button>
</header>

<section id="s-title" class="screen stars active">
  <div class="center">
    <div class="orb" aria-hidden="true"></div>
    <h1 id="t-title"></h1>
    <p class="pitch" id="t-pitch"></p>
    <div class="btnrow" id="t-btns"></div>
    <p class="fine">Keys: <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> continue · <kbd>F</kbd> fullscreen · <kbd>N</kbd> fact-check notes</p>
  </div>
</section>

<section id="s-globe" class="screen">
  <canvas id="globe" aria-label="Interactive globe. Use the country buttons below to choose a destination."></canvas>
  <div id="tip"></div>
  <div id="dock">
    <div id="hint">Drag to spin the globe · choose a glowing pin to visit</div>
    <div id="chips"></div>
  </div>
</section>

<section id="s-stage" class="screen stars"><div class="wrap"><div class="card" id="stage"></div></div></section>

<section id="s-final" class="screen stars"><div class="center" id="final"></div></section>

<script>
/* =====================================================================
   SCENARIOS: ALL GAME TEXT LIVES HERE. Edit freely; no game logic below
   depends on the wording. Basic HTML (<b>, <i>) is allowed in text.

   Conventions for the team:
   - source_note  : what to verify (and where) before presenting a claim.
                    Shown in-game only when "Notes" (N key) is switched on.
   - assumption: true : the numbers in that item are SIMPLIFIED GAME
                    ASSUMPTIONS, not documented data. They are marked
                    with "≈" in the game. assumption_note says which ones.
   - outcome      : the "what happens next" picture for an option.
                    bg = street | snow | home | bins | roof; art = emoji in the
                    scene; sticker = the short label stamped on the picture.
   - concept      : the course-concept panel on each country summary.
                    text = documented facts; game_note = game assumptions.
   - sources      : the list players can open under "Sources for documented facts".
   - Exactly one option per question has correct: true.
   - Scoring: 100 first try, 50 after a retry, 50 for the replay round.
   ===================================================================== */
const SCENARIOS = {
  meta: {
    title: "Making the Sustainable Choice <em>the Easy One</em>",
    pitch: "Travel to four countries, make everyday decisions, and see how rules, prices and infrastructure quietly shape what we choose.",
    take_home: "Good sustainable habits exist all over the world, and we can learn from each other.",
    credits: "CIV300 Group G13: Dayoung Nam, Grace Shi, Kovid Srivart, Nicholas Carbones.",
    // Rank = highest entry whose min_pct is reached (score / maximum).
    // Retries always earn half points, so the lowest possible score is a little over 50%.
    ranks: [
      { min_pct: 0,   title: "Eco Tourist" },
      { min_pct: 65,  title: "Curious Traveller" },
      { min_pct: 78,  title: "Policy Explorer" },
      { min_pct: 90,  title: "Systems Thinker" },
      { min_pct: 100, title: "Global Sustainability Ambassador" }
    ]
  },

  countries: [
    /* ------------------------------------------------ SOUTH KOREA */
    {
      id: "kr", name: "South Korea", flag: "🇰🇷", city: "Seoul", topic: "Waste",
      accent: "#60a5fa", scene_emoji: ["🏙️", "🍜", "♻️"],
      pins: [{ lat: 37.57, lon: 126.98, label: "Seoul" }],
      focus: { lat: 36.5, lon: 127.5 },
      intro: {
        title: "After dinner in Seoul",
        scene: "You just finished a takeout dinner in your Seoul apartment. The table is covered in containers, bottles and leftovers. Here, where each item goes decides what you pay.",
        policy_name: "Volume-based waste fee (jongnyangje, 종량제)",
        policy: "General trash must go out in official paid bags. Properly sorted recyclables are collected free.",
        source_note: "Verify with Korea Ministry of Environment: volume-based waste fee system, nationwide since 1995; bag prices set by each district."
      },
      questions: [
        {
          situation: "Seoul, after dinner. A plastic takeout container still has tteokbokki sauce stuck to it.",
          prompt: "Where does it go?",
          options: [

    if (b && !b.disabled) b.click();
  } else if (e.key === "Enter") {
    const a = document.activeElement; if (a && a.tagName === "BUTTON") return; // the browser clicks it for us
    const p = $(".screen.active [data-primary]"); if (p && !p.disabled) { e.preventDefault(); p.click(); }
  } else if (e.key === "n" || e.key === "N") toggleNotes();
  else if (e.key === "f" || e.key === "F") toggleFull();
});

renderTitle();
show("title");
})();
</script>
</body>
</html>
